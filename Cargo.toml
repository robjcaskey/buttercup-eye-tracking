[package]
name = "buttercup-eye-tracking"
version = "0.1.0"
edition = "2021"
default-run = "buttercup-eye-viewer"

[dependencies]
libloading = "0.8.9"
serde_json = "1.0"
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
opencv = { version = "0.92.3", optional = true, default-features = false, features = ["clang-runtime", "imgproc", "calib3d"] }
tch = { version = "0.22.0", optional = true }
flate2 = { version = "1.1", optional = true }
regex = { version = "1.11", optional = true }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[features]
default = ["checkerboard"]
checkerboard = ["dep:opencv"]
sam31 = ["dep:opencv", "dep:tch", "dep:flate2", "dep:regex"]

[profile.release]
strip = true
lto = true
codegen-units = 1

# Interactive camera work changes the large viewer much more often than it
# changes the native LibTorch bridge.  Keep the production profile above for
# final artifacts, but let the normal live launcher reuse incremental objects
# and relink in parallel.  SAM inference itself runs in the CUDA graph, so
# disabling host-side full LTO does not meaningfully change its throughput.
[profile.live]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true

[[bin]]
name = "buttercup-eye-viewer"
path = "src/main.rs"

[[bin]]
name = "buttercup-screen-reflection-raw-decode"
path = "src/bin/buttercup_screen_reflection_raw_decode.rs"

[[bin]]
name = "buttercup-sam31-arc-trial"
path = "src/bin/buttercup_sam31_arc_trial.rs"

[[bin]]
name = "buttercup-sam31-video-graph"
path = "src/bin/buttercup_sam31_video_graph.rs"

[[bin]]
name = "buttercup-sam31-tracker-bundle"
path = "src/bin/buttercup_sam31_tracker_bundle.rs"
required-features = ["sam31"]
